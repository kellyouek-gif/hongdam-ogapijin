<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">

<title>홍담오가피진 문의 관리</title>
<style>
:root {
  --green: #14291C;
  --green-mid: #1E3D2A;
  --green-light: #2C5238;
  --gold: #C9A24B;
  --gold-light: #E8C87A;
  --cream: #F6F1E7;
  --cream-dark: #EDE5D4;
  --ink: #1A1A1A;
  --muted: #6B7280;
  --surface: #FFFFFF;
  --border: #DDD6C8;
  --success: #2D6A4F;
  --radius: 10px;
}
@media(prefers-color-scheme:dark){
  :root{
    --cream:#1A2218; --cream-dark:#151D13;
    --surface:#1E2D1E; --border:#2E4030;
    --ink:#F0EBE0; --muted:#8FA08A;
  }
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;}

/* ── HEADER ── */
.header{background:var(--green);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;}
.header-brand{display:flex;align-items:center;gap:12px;}
.header-dot{width:10px;height:10px;border-radius:50%;background:var(--gold);}
.header-title{font-size:17px;font-weight:700;color:#fff;letter-spacing:.02em;}
.header-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px;}
.header-badge{background:var(--gold);color:var(--green);font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px;letter-spacing:.06em;}

/* ── LAYOUT ── */
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 62px);}

/* ── SIDEBAR ── */
.sidebar{background:var(--green-mid);padding:28px 16px;display:flex;flex-direction:column;gap:6px;}
.sidebar-label{font-size:10px;font-weight:800;color:rgba(255,255,255,.35);letter-spacing:.14em;text-transform:uppercase;padding:0 10px;margin-bottom:6px;}
.tab-btn{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:8px;border:none;background:transparent;color:rgba(255,255,255,.65);font-size:14px;font-weight:500;cursor:pointer;text-align:left;width:100%;transition:all .18s;}
.tab-btn:hover{background:rgba(255,255,255,.08);color:#fff;}
.tab-btn.active{background:var(--gold);color:var(--green);font-weight:700;}
.tab-icon{font-size:16px;width:20px;text-align:center;}
.tab-count{margin-left:auto;background:rgba(255,255,255,.18);color:rgba(255,255,255,.8);font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;}
.tab-btn.active .tab-count{background:rgba(20,41,28,.25);color:var(--green);}
.sidebar-divider{height:1px;background:rgba(255,255,255,.08);margin:10px 4px;}

/* ── MAIN ── */
.main{padding:32px 36px;overflow-y:auto;}
.section-head{margin-bottom:28px;}
.section-title{font-size:22px;font-weight:800;color:var(--ink);}
.section-desc{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.6;}

/* ── TEMPLATE CARDS ── */
.template-grid{display:flex;flex-direction:column;gap:20px;}
.template-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:box-shadow .2s;}
.template-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-tag{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:rgba(201,162,75,.12);padding:4px 10px;border-radius:6px;}
.card-situation{font-size:13px;font-weight:600;color:var(--ink);}
.card-body{padding:20px;}
.card-subject{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;}
.card-subject span{color:var(--green);font-weight:800;}
.card-content{font-size:14px;line-height:1.85;color:var(--ink);white-space:pre-wrap;background:var(--cream);border-radius:8px;padding:16px;border:1px solid var(--border);}
.card-footer{padding:12px 20px;display:flex;gap:10px;border-top:1px solid var(--border);background:var(--cream-dark);}
.btn-copy{background:var(--green);color:#fff;border:none;padding:8px 18px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-copy:hover{background:var(--green-light);}
.btn-copy.copied{background:var(--success);}
.btn-edit{background:transparent;color:var(--muted);border:1px solid var(--border);padding:8px 14px;border-radius:7px;font-size:13px;cursor:pointer;transition:all .2s;}
.btn-edit:hover{border-color:var(--gold);color:var(--gold);}

/* ── GUIDE SECTION ── */
.guide-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:24px;}
.guide-title{font-size:16px;font-weight:800;color:var(--green);margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.guide-title::before{content:'';width:4px;height:18px;background:var(--gold);border-radius:2px;display:inline-block;}
.steps{display:flex;flex-direction:column;gap:16px;}
.step{display:flex;gap:14px;align-items:flex-start;}
.step-num{width:28px;height:28px;min-width:28px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.step-body{}
.step-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.step-desc{font-size:13px;color:var(--muted);line-height:1.6;}
.step-desc a{color:var(--gold);text-decoration:none;font-weight:600;}
.code-block{margin-top:10px;background:#1A2218;color:#A8D8A8;font-size:12px;font-family:'Courier New',monospace;padding:16px;border-radius:8px;white-space:pre;overflow-x:auto;line-height:1.7;}
.code-copy-btn{display:inline-block;margin-top:8px;background:var(--gold);color:var(--green);border:none;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;}

/* ── PANEL TOGGLE ── */
.panel{display:none;}
.panel.active{display:block;}

/* ── 로그인 사용자 / 권한 ── */
a.tab-btn{text-decoration:none;}
.admin-only{display:none !important;}
body.is-admin .admin-only{display:flex !important;}
body.is-admin .sidebar-label.admin-only{display:block !important;}
.header-user{display:flex;align-items:center;gap:10px;}
.header-logout{color:rgba(255,255,255,.7);font-size:12px;text-decoration:none;border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:20px;}
.header-logout:hover{color:#fff;border-color:var(--gold);}
</style>
</head>

function renderTemplates(type, containerId) {
  const list = type === 'all' ? templates : templates.filter(t => t.type === type);
  const container = document.getElementById(containerId);
  container.innerHTML = list.map((t, i) => `
    <div class="template-card">
      <div class="card-header">
        <span class="card-tag">${t.tag}</span>
        <span class="card-situation">${t.situation}</span>
      </div>
      <div class="card-body">
        <div class="card-subject">제목: <span>${t.subject}</span></div>
        <div class="card-content" id="content-${type}-${i}">${t.content}</div>
      </div>
      <div class="card-footer">
        <button class="btn-copy" onclick="copyTemplate('${type}','${i}',this)">📋 내용 복사</button>
        <button class="btn-copy" style="background:#8B6914" onclick="copySubject('${t.subject}',this)">제목 복사</button>
        <button class="btn-edit" onclick="editTemplate('${type}','${i}')">✏️ 수정</button>
      </div>
    </div>
  `).join('');
}

function copyTemplate(type, i, btn) {
  const el = document.getElementById('content-' + type + '-' + i);
  navigator.clipboard.writeText(el.textContent);
  btn.textContent = '✅ 복사됨!';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = '📋 내용 복사'; btn.classList.remove('copied'); }, 2000);
}

function copySubject(subject, btn) {
  navigator.clipboard.writeText(subject);
  btn.textContent = '✅ 복사됨!';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = '제목 복사'; btn.classList.remove('copied'); }, 2000);
}

function editTemplate(type, i) {
  const el = document.getElementById('content-' + type + '-' + i);
  el.contentEditable = el.contentEditable === 'true' ? 'false' : 'true';
  if (el.contentEditable === 'true') {
    el.style.border = '2px solid #C9A24B';
    el.focus();
  } else {
    el.style.border = '';
  }
}

function showTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
}

// 초기화
renderTemplates('all', 'all-templates');
renderTemplates('buy', 'buy-templates');
renderTemplates('b2b', 'b2b-templates');

  var m=document.cookie.match(/(?:^|; )hd_role=([^;]+)/);
  var role=m?m[1]:'';
  if(role==='admin') document.body.classList.add('is-admin');
  var b=document.getElementById('role-badge');
  if(b) b.textContent = role==='admin' ? '관리자' : role==='staff' ? '부관리자' : '관리';
})();
</script>
</body>
</html>
